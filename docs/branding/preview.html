<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pøziel — logo C draft</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #18191b; color: #f3f1e9; font-family: 'Segoe UI', sans-serif; }
      main { max-width: 1060px; margin: auto; padding: 40px 24px; }
      h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
      p { color: #abacae; margin: 0; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; margin-top: 32px; border: 1px solid #353638; }
      .sample { display: grid; place-items: center; padding: 28px; min-width: 0; }
      .sample.light { background: #f3f1e9; }
      .sample img { width: 100%; max-width: 320px; height: auto; }
      .sizes { display: flex; align-items: center; gap: 36px; margin-top: 40px; }
      figure { margin: 0; display: grid; justify-items: center; gap: 12px; }
      figcaption { font-size: 12px; color: #abacae; }
      img { display: block; }
      @media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Pøziel · direction C</h1>
      <p>The EØGAMING-inspired Ø, in the website’s warm amber. Draft for review.</p>
      <div class="pair">
        <div class="sample"><img src="poziel-mark-c-draft.png" alt="Angular amber Ø logo on charcoal"></div>
        <div class="sample light"><img src="poziel-mark-c-draft.png" alt="Angular amber Ø logo on ivory"></div>
      </div>
      <div class="sizes" aria-label="Small-size previews">
        <figure><img src="poziel-mark-c-draft.png" width="24" height="24" alt="Logo at 24 pixels"><figcaption>24 px</figcaption></figure>
        <figure><img src="poziel-mark-c-draft.png" width="40" height="40" alt="Logo at 40 pixels"><figcaption>40 px</figcaption></figure>
        <figure><img src="poziel-mark-c-draft.png" width="80" height="80" alt="Logo at 80 pixels"><figcaption>80 px</figcaption></figure>
      </div>
    </main>
  </body>
</html>
