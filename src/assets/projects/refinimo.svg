<svg xmlns="http://www.w3.org/2000/svg" width="462" height="465" viewBox="14 11 462 465" fill="none">
  <title>Refinimo poker chip</title>
  <desc>A navy poker chip with alternating blue and white edge segments and a white inner ring with eight blue markers.</desc>
  <defs>
    <linearGradient id="body" x1="150" y1="20" x2="335" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142553"/>
      <stop offset=".5" stop-color="#07153e"/>
      <stop offset="1" stop-color="#020b29"/>
    </linearGradient>
    <radialGradient id="face" cx="190" cy="148" r="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10214e"/>
      <stop offset="1" stop-color="#030c2b"/>
    </radialGradient>
    <linearGradient id="blue" x1="245" y1="12" x2="245" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00baff"/>
      <stop offset=".42" stop-color="#009bff"/>
      <stop offset="1" stop-color="#0067ff"/>
    </linearGradient>
    <linearGradient id="ivory" x1="170" y1="60" x2="330" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".6" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#dfdfe0"/>
    </linearGradient>
    <linearGradient id="rim" x1="245" y1="12" x2="245" y2="473" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4d9ff" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#7184ac" stop-opacity=".28"/>
      <stop offset=".78" stop-color="#06102f" stop-opacity=".1"/>
      <stop offset="1" stop-color="#edf2ff" stop-opacity=".65"/>
    </linearGradient>
  </defs>
  <!-- Slightly lowered edge gives the chip its shallow bevel. -->
