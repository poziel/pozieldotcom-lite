  <circle cx="245" cy="242" r="222.5" stroke="#010822" stroke-width="1.2"/>
  <path d="M 28.716 179.982 A 225 225 0 0 1 461.284 179.982" stroke="#e4f3ff" stroke-opacity=".48" stroke-width="1"/>
