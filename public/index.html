<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poziel</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand': {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .domain-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4">
    
    <div class="w-full max-w-md">
        
        <!-- Header with Name & Domain Badge -->
        <div class="text-center mb-8 animate-fade-in-up" style="animation-delay: 0.1s;">
            <h1 class="text-5xl font-bold text-white mb-2" id="name">Poziel</h1>
            <span class="domain-badge text-white" id="domain-badge">poziel.com</span>
            <p class="text-white/80 mt-4 text-sm" id="tagline">Developer • Creator • Gamer</p>
        </div>
        
        <!-- Social Links Container -->
        <div id="social-links" class="space-y-3">
            <!-- Cards will be injected here by JavaScript -->
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-8 text-white/60 text-sm animate-fade-in-up" style="animation-delay: 0.5s;">
            <p>© 2025 Poziel. All rights reserved.</p>
        </div>
        
    </div>
    
    <!-- Load domain configuration -->
    <script src="config.js"></script>
    
    <!-- Main JavaScript -->
    <script>
        // Get current domain
        const hostname = window.location.hostname;
        const domain = hostname.replace('www.', '');
        
        // Find matching config or use default
        const config = DOMAIN_CONFIG[domain] || DOMAIN_CONFIG['poziel.com'];
        
        // Update page elements
        document.getElementById('name').textContent = config.name;
        document.getElementById('domain-badge').textContent = domain;
        document.getElementById('tagline').textContent = config.tagline;
        document.title = config.name;
        
        // Generate social link cards
        const socialLinksContainer = document.getElementById('social-links');
        
        config.socials.forEach((social, index) => {
            const card = document.createElement('a');
            card.href = social.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.className = 'block bg-white/10 backdrop-blur-md rounded-2xl p-5 text-white card-hover animate-fade-in-up';
            card.style.animationDelay = `${0.2 + (index * 0.1)}s`;
            
            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">
                            ${social.icon}
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg">${social.name}</h3>
                            <p class="text-white/70 text-sm">${social.handle}</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            `;
            
            socialLinksContainer.appendChild(card);
        });
    </script>
    
</body>
</html>
